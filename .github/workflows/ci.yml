name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Both runners, because what this repo writes into a person's machine is bash: two hook
  # scripts and a completion gate. macOS ships bash 3.2 and BSD userland (`sed -i` takes an
  # argument, `grep` has no `-P`), so a hook written against GNU tooling passes every Linux job
  # and fails in the terminal of the person who runs `setup` — and the only macOS verification
  # this ever had was somebody running it locally and remembering to say so.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # The repo has to pass its own doctor, on itself and on the examples it ships.
      - run: bun run doctor . examples

  # The gates above all run under bun, so they cannot see the one thing a published package has
  # to do: run on a machine that has only Node. Packing and installing the tarball is the only
  # check that exercises the real bin, the real `files` list and the real `repoRoot()` layout.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - run: bun install --frozen-lockfile
      # `prepack` builds dist/, so this also proves the bundle builds.
      - run: npm pack
      - run: tar -tzf personal-config-*.tgz | grep -qx 'package/dist/cli.js'
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: personal-config-*.tgz

  node-install:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor claimed by `engines.node`, and the two LTS lines above it.
        node: ['20', '22', '24']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      # No checkout and no setup-bun in this job on purpose: `command -v bun` must find nothing,
      # or the run below proves only that bun was available, which is the bug this job exists for.
      - run: if command -v bun; then echo "bun is on PATH — this job proves nothing"; exit 1; fi
      - run: npm install -g ./personal-config-*.tgz
      - run: personal-config --version
      - run: personal-config help
      # doctor reads standard/, templates/ and catalog.json through repoRoot(); a wrong root
      # resolves into node_modules/ and fails here rather than in a user's terminal.
      - run: mkdir -p probe && cd probe && personal-config doctor .
      # `doctor` above never reaches profiles/ (loadConfig, src/lib/config.ts) or docs/choices/
      # (readMore/readChoices, src/lib/ask.ts + src/lib/catalog.ts) — both are only on the
      # `setup` and `catalog` paths, so a `files`-list or repoRoot() regression there would ship
      # to npm without any job noticing. Assert on printed content, not exit code alone, since a
      # silently-empty plan would still exit 0.
      - name: setup --dry-run exercises profiles/
        run: |
          mkdir -p probe/empty-projects
          cd probe
          personal-config setup --profile starter --yes --dry-run --projects-dir empty-projects | tee setup-output.txt
          grep -q 'commits.md' setup-output.txt
          # profiles/starter.json answers "skills": "none". If profiles/ failed to resolve, the
          # question's own recommended default takes over and renders skill files instead — so
          # their absence is what proves the profile, not just the templates, was read.
          if grep -q 'skills' setup-output.txt; then
            echo "profiles/starter.json's skills:none answer was not honored — profiles/ may not have resolved"
            exit 1
          fi
      - name: catalog exercises docs/choices/
        run: |
          personal-config catalog | tee catalog-output.txt
          grep -qE '[1-9][0-9]* long form\(s\)' catalog-output.txt
      # A mistyped command used to print help and exit 0, so a typo passed as a successful run.
      # Asserted on the installed artifact because that is the copy a person mistypes at.
      - name: a bad command and a bad flag fail loudly
        run: |
          if personal-config setpu; then echo "a mistyped command exited 0"; exit 1; fi
          if personal-config doctor --dryrun; then echo "a mistyped flag exited 0"; exit 1; fi
          personal-config setpu > cmd.txt 2>&1 || true
          personal-config doctor --dryrun > flag.txt 2>&1 || true
          grep -q "unknown command 'setpu'" cmd.txt
          grep -q "Unknown option '--dryrun'" flag.txt
          # Written as an explicit failure, not `grep -qv`: that succeeds whenever any one line
          # lacks the word, which is every multi-line output, and so asserts nothing.
          if grep -q 'TypeError' cmd.txt flag.txt; then echo "a stack trace reached the user"; exit 1; fi

  # CLAUDE.md's own rule for `standard/`: "byte-for-byte except its version line." Nothing before
  # this enforced it — a content edit that forgot to bump `standard/VERSION` and note itself in
  # `standard/CHANGELOG.md` passed silently, and every repo already adapted from the boilerplate
  # had no way to tell its copy had drifted from the one this repo ships.
  boilerplate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a boilerplate change without a version bump is a red build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # The first push on a new branch, or to an empty repo, has no base to diff against.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no base commit to diff against — skipping"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          # Both forms of the standard share one VERSION (setup-tracks DESIGN.md D10), so a
          # change to either owes the bump and the changelog line.
          for doc in standard/AGENT-PRACTICES.boilerplate.md standard/AGENT-PRACTICES.short.md; do
            if echo "$changed" | grep -qx "$doc"; then
              if ! echo "$changed" | grep -qx 'standard/VERSION'; then
                echo "$doc changed but standard/VERSION did not."
                echo "CLAUDE.md: the standard is byte-for-byte except its version line."
                exit 1
              fi
              if ! echo "$changed" | grep -qx 'standard/CHANGELOG.md'; then
                echo "$doc changed but standard/CHANGELOG.md did not."
                exit 1
              fi
            fi
          done
